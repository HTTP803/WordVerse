  <div class="num"><span id="litCount">0</span> <span style="font-size:14px;color:#8b93c0">/ <span id="libTotal">5500</span></span></div>
  <div class="lbl">已点亮 · <span id="libName">考研英语</span></div>
  <div class="rank" id="rankLine" title="点击查看成就">✦ <span id="rankName">星尘</span> <span class="rprog" id="rankProg"></span></div>
  <div class="streak">🔥 连续打卡 <span id="streak">0</span> 天 · 待复习 <span id="dueCount">0</span></div>
  <div class="trend" id="trend"></div>
  <div class="day">📅 今日学习 <span id="dayLearned">0</span>/<span id="dayGoal">20</span> 词</div>
  <div class="daybar"><div class="dayfill" id="dayFill"></div></div>
  <div class="hsep"></div>
  <button class="qbtn" id="quizBtn">🎯 主动学习</button>
  <button class="qbtn" id="reviewBtn">🔁 复习</button>
</div>
<div id="leftTools">
  <button class="qbtn tool" id="shareBtn">📷 我的星图</button>
  <button class="qbtn tool" id="achBtn">🏆 成就</button>
  <button class="qbtn tool" id="helpBtn">📖 教学</button>
</div>
<div id="mediaBar">
  <button class="qbtn tool" id="celBtn">🌟 天体</button>
  <button class="qbtn tool" id="musicBtn">🎵 音乐</button>
  <button class="qbtn tool" id="musicUpBtn" title="使用本地音乐文件">⤴</button>
  <input id="musicFile" type="file" accept="audio/*" style="display:none">
</div>
<div id="legend" class="panel"></div>
<div id="tip" class="panel">拖动旋转 · 滚轮缩放 · 点星看词 · 左下角图例可切「全部 / 未学 / 学习中 / 已掌握」· 🎯主动学习 / 🔁复习 · 每天学 20 词 · 不会用点 📖教学</div>
<div id="card" class="panel">
  <span class="close" id="cardClose">×</span>
  <div class="fam" id="cFam"></div>
  <div class="word"><span id="cWord"></span><span class="spk" id="cSpk">🔊</span></div>
  <div class="ph" id="cPh"></div>
  <div class="def" id="cDef"></div>
  <div class="parse" id="cParse"></div>
  <div class="eg" id="cEg"></div>
  <button class="btn" id="cBtn">✓ 我背会了，点亮这颗星</button>
</div>
<div id="quiz" class="panel">
  <div id="qBody">
    <div class="qtop"><span class="fam" id="qFam"></span><span class="prog" id="qProg"></span></div>
    <div class="qmodes"><button class="qmode on" data-t="mix">混合</button><button class="qmode" data-t="choose">选择</button><button class="qmode" data-t="spell">拼写</button></div>
    <div class="qhint" id="qHint">根据释义 / 发音，选出正确单词</div>
    <div class="def" id="qDef"></div>
    <div class="phline"><span class="ph" id="qPh"></span><span class="spk" id="qSpk">🔊</span></div>
    <div class="opts" id="qOpts"></div>
    <div class="spell" id="qSpell" style="display:none"><input id="qInput" class="sinput" placeholder="输入英文单词" autocomplete="off" /><button class="btn show" id="qSubmit">提交</button></div>
    <div class="parse" id="qParse" style="display:none"></div>
    <div class="eg" id="qEg" style="display:none"></div>
    <div class="fb" id="qFb" style="display:none"></div>
    <button class="btn show" id="qNext" style="display:none">下一题 →</button>
    <button class="btn exit" id="qExit">退出测验</button>
  </div>
  <div id="qDone" class="done" style="display:none">
    <div class="big">本轮完成 🎉</div>
    <div class="st" id="qStat"></div>
    <button class="btn show" id="qAgain">再来一组</button>
    <button class="btn exit" id="qExit2">退出</button>
  </div>
</div>
<div id="share" class="panel">
  <span class="close" id="shareClose">×</span>
  <img id="shareImg" alt="我的星图">
  <button class="btn" id="shareDl">⬇ 下载星图</button>
</div>
<div id="toast"></div>
<div id="ach" class="panel">
  <div class="box">
    <span class="close" id="achClose">×</span>
    <h2>🏆 我的成就</h2>
    <div class="rankNow" id="achRank"></div>
    <div class="rankBar"><div class="rankFill" id="achRankFill"></div></div>
    <div class="rankNext" id="achRankNext"></div>
    <div class="grid" id="achGrid"></div>
  </div>
</div>
<div id="tut" class="panel">
  <div class="box">
    <span class="close" id="tutClose">×</span>
    <video id="tutVideo" controls preload="none"></video>
    <div class="illo" id="tutIllo"></div>
    <h2 id="tutTitle"></h2>
    <p id="tutDesc"></p>
    <div class="dots" id="tutDots"></div>
    <div class="nav">
      <button class="prev" id="tutPrev">上一步</button>
      <button class="next" id="tutNext">下一步 →</button>
    </div>
  </div>
</div>
<script src="js/words.js"></script>
<script src="js/vendor/three.min.js"></script>
<script src="js/vendor/OrbitControls.js"></script>
<script src="js/app.js"></script>
</body>
</html>
